name: Build catalogue

# 只读通路：本工作流只做 GET，写权限仅用于把生成的 catalogue.json 提交回仓库。
# token 由仓库 secrets 提供（只读 PAT），命名为 MJ_*——与任何本地登录态隔离。
on:
  push:
    branches: [main]
    paths:
      # 整个派生链路：任何一个改了，产出都可能变，必须重新派生。
      # 只列 generate-catalogue.mjs 曾经漏掉 contributors.mjs 的改动——
      # 改了取数逻辑却不重新派生，线上会一直停在旧数据上。
      - 'material/urls.txt'
      - 'scripts/generate-catalogue.mjs'
      - 'scripts/contributors.mjs'
      - 'scripts/enrich.mjs'
      - 'scripts/completeness.mjs'
      - '.github/workflows/catalogue.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node 26（26.12.1 起）：2026-10 安全修复线（Brotli RCE / DNS /
          # TLS ×2 四项全修），与 isui.ren 其余仓同口径；check-latest 防
          # runner 镜像缓存滞后。别退回 22 —— 22 的 --test 还不支持目录参数，
          # 且缺失上述安全修复。
          node-version: 26
          check-latest: true

      - name: Install dependencies
        # --ignore-scripts：不执行任何依赖的安装脚本
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install ag-cli
        # AtomGit/GitCode 官方 CLI；npm 全局装在 runner 上，不落 token
        run: npm install -g @hust-open-atom-club/atomgit-cli@0.7.4 --ignore-scripts --no-audit --no-fund

      - name: Check the completeness rule
        # 判据自己的测试：先证明它会在该红的时候红，再拿它去判数据。
        run: node --test tests/

      - name: Derive catalogue
        # token 只进本步骤进程环境，不落盘、不写进 catalogue。
        # 缺令牌 / 限流 / 网络失败会让派生**退出非零**（CI 红、不部署），
        # 并把原因逐条打印出来；可接受的缺失（私有、平台不提供）记进
        # catalogue 的 rejected[] 与 entry.reasons，页面照常渲染。
        # 判据在 scripts/completeness.mjs，本地跑 node --test tests/ 可验。
        env:
          AGCLI_TOKEN: ${{ secrets.MJ_GITCODE_TOKEN }}
          MJ_GITCODE_TOKEN: ${{ secrets.MJ_GITCODE_TOKEN }}
          MJ_GITHUB_TOKEN: ${{ secrets.MJ_GITHUB_TOKEN }}
          MJ_GITEE_TOKEN: ${{ secrets.MJ_GITEE_TOKEN }}
          MJ_CNB_TOKEN: ${{ secrets.MJ_CNB_TOKEN }}
          MJ_GITLAB_TOKEN: ${{ secrets.MJ_GITLAB_TOKEN }}
          MJ_BITBUCKET_TOKEN: ${{ secrets.MJ_BITBUCKET_TOKEN }}
        run: node scripts/generate-catalogue.mjs

      - name: Commit generated catalogue
        run: |
          if git diff --quiet -- site/catalogue.json; then
            echo "catalogue unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/catalogue.json
          git commit -m "chore(catalogue): auto-derived from material/urls.txt"
          # 本文件是 catalogue.json 的**唯一**写入者；即便如此仍可能有别的
          # 工作流在同一时刻提交过别的文件，push 前先 rebase。
          # 不复用 deploy 曾经那套 `|| true`：吞掉 rebase 失败后会在游离 HEAD
          # 上 push（实测 8400ebc 就是这么红的）。这里失败就是真失败。
          git pull --rebase origin main
          git push
