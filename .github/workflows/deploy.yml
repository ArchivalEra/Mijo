name: Deploy to isui.ren

# 站点上线：派生 catalogue → 推 site/ 到 isui.ren-heart@deploy 的 Mijo/ 目录。
# 与 S26-1_202609、MangoMesa 同一模式：产物只写自己那个 slot 目录，
# 其余目录由各自的仓维护（heart 的 deploy 分支是多个 slot 的共用平面）。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-mijo
  cancel-in-progress: true

permissions:
  # write 是给「提交派生的 catalogue.json」用的（heart 从仓库拉，不提交就会读到旧版）
  contents: write

jobs:
  deploy:
    name: Build catalogue & push to isui.ren-heart
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # node 26（26.12.1 起）：2026-10 安全修复线（Brotli RCE / DNS /
          # TLS ×2 四项全修），与 isui.ren 其余仓同口径；check-latest 防
          # runner 镜像缓存滞后。别退回 22 —— 22 的 --test 还不支持目录参数，
          # 且缺失上述安全修复。
          node-version: 26
          check-latest: true

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install -g @hust-open-atom-club/atomgit-cli@0.7.4 --ignore-scripts --no-audit --no-fund

      - name: Check the completeness rule
        # 判据自己的测试：先证明它会在该红的时候红，再拿它去判数据。
        run: node --test tests/

      - name: Derive catalogue
        # 部署流取的是**本次**最新数据，不读仓库里那一份：仓库里的
        # catalogue 由 catalogue.yml 维护，可能落后一个提交周期。
        #
        # 这一步同时是部署闸门：数据不全时派生退出非零（缺令牌/限流/
        # 网络失败/裸 null 字段），job 立刻失败，下面的 dispatch 不执行，
        # 线上继续跑上一版。判据见 scripts/completeness.mjs。
        #
        # 本步骤**不提交**：catalogue.yml 是 catalogue.json 的唯一写入者。
        # 两个 workflow 各自提交同一文件会互相顶掉（实测 8400ebc：deploy 的
        # `git pull --rebase || true` 吞掉冲突，随后在游离 HEAD 上 push 失败）。
        env:
          AGCLI_TOKEN: ${{ secrets.MJ_GITCODE_TOKEN }}
          MJ_GITCODE_TOKEN: ${{ secrets.MJ_GITCODE_TOKEN }}
          MJ_GITHUB_TOKEN: ${{ secrets.MJ_GITHUB_TOKEN }}
          MJ_GITEE_TOKEN: ${{ secrets.MJ_GITEE_TOKEN }}
          MJ_CNB_TOKEN: ${{ secrets.MJ_CNB_TOKEN }}
          MJ_GITLAB_TOKEN: ${{ secrets.MJ_GITLAB_TOKEN }}
          MJ_BITBUCKET_TOKEN: ${{ secrets.MJ_BITBUCKET_TOKEN }}
        run: node scripts/generate-catalogue.mjs

      - name: Wait for the catalogue commit to land
        # heart 拉的是**仓库里的** site/，不是本次 job 的产物，所以必须等
        # catalogue.yml 把本次数据提交完再 dispatch，否则上线的是上一版。
        #
        # 判据是**提交时间**，不是内容相等：两个 workflow 各自派生一次，
        # 而派生本身不保证逐字节可重复（API 返回顺序、限流、头像可用性都会变）。
        # 曾经用「内容一致」判，结果 CI 里等了 31 轮全不等、直接红掉——
        # 那次失败不是数据有问题，是这个判据要求了一件做不到的事。
        #
        # 现在只问：origin/main 上 site/catalogue.json 的最后一次提交，
        # 是否发生在本 job 开始之后（本 job 由同一次 push 触发）。
        run: |
          set -euo pipefail
          # 本 job 起始时间（checkout 的 HEAD commit 时间），留 60s 容差
          since=$(git log -1 --format=%ct HEAD)
          since=$((since - 60))
          echo "等待 origin/main:site/catalogue.json 出现晚于 $(date -u -d @$since +%FT%TZ) 的提交"
          for i in $(seq 1 30); do
            git fetch --quiet origin main || true
            if git cat-file -e origin/main:site/catalogue.json 2>/dev/null; then
              ctime=$(git log -1 --format=%ct origin/main -- site/catalogue.json)
              if [ "$ctime" -ge "$since" ]; then
                echo "仓库里的 catalogue 已于 $(date -u -d @$ctime +%FT%TZ) 更新（本次 push 之后）"
                exit 0
              fi
            fi
            echo "  等待 catalogue.yml 提交本次数据…（$i/30）"
            sleep 10
          done
          echo "::error::等了 5 分钟仓库里的 catalogue 仍未更新 —— catalogue.yml 可能失败，拒绝部署旧数据"
          exit 1

      - name: Trigger isui.ren-heart deploy (dispatch, no cross-repo write)
        # Mijo 不持有 isui.ren-heart 的写权限，也不去推它的 deploy 分支——
        # 那会与别的 slot 仓抢同一个分支。改为触发 heart 的 deploy workflow，
        # 由 heart 主动来拉本仓的 site/（见 heart 的 deploy.yml「Pull Mijo slot」）。
        # 对应 Static-Contract 的同一套做法（HEART_DISPATCH_TOKEN）。
        env:
          TOKEN: ${{ secrets.HEART_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::HEART_DISPATCH_TOKEN 未配置 —— heart 不会自动来取，"
            echo "::warning::站点会停在上一次构建，直到有人手动触发 heart 的 deploy。"
            exit 0
          fi
          # 取 workflow id：失败必须立刻红（否则「没 dispatch 成功却往下走」）
          WF=$(curl -sSf -H "Authorization: token $TOKEN" \
            https://api.github.com/repos/ArchivalEra/isui.ren-heart/actions/workflows \
            | python3 -c "import json,sys; print(next(w['id'] for w in json.load(sys.stdin)['workflows'] if w['name']=='deploy'))")
          echo "heart deploy workflow id = $WF"
          CODE=$(curl -sSf -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ArchivalEra/isui.ren-heart/actions/workflows/$WF/dispatches" \
            -d '{"ref":"main"}') || {
              echo "::error::dispatch 失败（HTTP ${CODE:-?}）——检查 HEART_DISPATCH_TOKEN 是否有该仓 Actions:write"
              exit 1
            }
          echo "dispatch HTTP $CODE（202 为成功）"
