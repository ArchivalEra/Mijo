name: Deploy to isui.ren

# 站点上线：派生 catalogue → 推 site/ 到 isui.ren-heart@deploy 的 Mijo/ 目录。
# 与 S26-1_202609、MangoMesa 同一模式：产物只写自己那个 slot 目录，
# 其余目录由各自的仓维护（heart 的 deploy 分支是多个 slot 的共用平面）。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-mijo
  cancel-in-progress: true

permissions:
  # write 是给「提交派生的 catalogue.json」用的（heart 从仓库拉，不提交就会读到旧版）
  contents: write

jobs:
  deploy:
    name: Build catalogue & push to isui.ren-heart
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install -g @hust-open-atom-club/atomgit-cli@0.7.4 --ignore-scripts --no-audit --no-fund

      - name: Derive catalogue
        env:
          AGCLI_TOKEN: ${{ secrets.MJ_GITCODE_TOKEN }}
          MJ_GITCODE_TOKEN: ${{ secrets.MJ_GITCODE_TOKEN }}
          MJ_GITHUB_TOKEN: ${{ secrets.MJ_GITHUB_TOKEN }}
          MJ_GITEE_TOKEN: ${{ secrets.MJ_GITEE_TOKEN }}
          MJ_CNB_TOKEN: ${{ secrets.MJ_CNB_TOKEN }}
          MJ_GITLAB_TOKEN: ${{ secrets.MJ_GITLAB_TOKEN }}
          MJ_BITBUCKET_TOKEN: ${{ secrets.MJ_BITBUCKET_TOKEN }}
        run: node scripts/generate-catalogue.mjs

      - name: Commit generated catalogue
        # 必须先提交再 dispatch —— heart 拉的是**仓库里的** site/，
        # 不是本次 job 的临时产物。不提交，heart 会取到上一版
        # （实测：generatedAt 一直停在上一次，contributors 也是旧的）。
        run: |
          if git diff --quiet -- site/catalogue.json; then
            echo "catalogue unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/catalogue.json
          git commit -m "chore(catalogue): auto-derived from material/urls.txt"
          # catalogue.yml 也在提交同一个文件，先 rebase 再推，避免互相顶掉
          git pull --rebase --autostash origin main || true
          git push

      - name: Trigger isui.ren-heart deploy (dispatch, no cross-repo write)
        # Mijo 不持有 isui.ren-heart 的写权限，也不去推它的 deploy 分支——
        # 那会与别的 slot 仓抢同一个分支。改为触发 heart 的 deploy workflow，
        # 由 heart 主动来拉本仓的 site/（见 heart 的 deploy.yml「Pull Mijo slot」）。
        # 对应 Static-Contract 的同一套做法（HEART_DISPATCH_TOKEN）。
        env:
          TOKEN: ${{ secrets.HEART_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::HEART_DISPATCH_TOKEN 未配置 —— heart 不会自动来取，"
            echo "::warning::站点会停在上一次构建，直到有人手动触发 heart 的 deploy。"
            exit 0
          fi
          # 取 workflow id：失败必须立刻红（否则「没 dispatch 成功却往下走」）
          WF=$(curl -sSf -H "Authorization: token $TOKEN" \
            https://api.github.com/repos/ArchivalEra/isui.ren-heart/actions/workflows \
            | python3 -c "import json,sys; print(next(w['id'] for w in json.load(sys.stdin)['workflows'] if w['name']=='deploy'))")
          echo "heart deploy workflow id = $WF"
          CODE=$(curl -sSf -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ArchivalEra/isui.ren-heart/actions/workflows/$WF/dispatches" \
            -d '{"ref":"main"}') || {
              echo "::error::dispatch 失败（HTTP ${CODE:-?}）——检查 HEART_DISPATCH_TOKEN 是否有该仓 Actions:write"
              exit 1
            }
          echo "dispatch HTTP $CODE（202 为成功）"
