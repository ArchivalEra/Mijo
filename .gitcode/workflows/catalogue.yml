name: Build catalogue

# AtomGit / GitCode Action 流水线（文件位置与语法见官方帮助文档：
# org_project/pipeline/writing-pipelines/workflow-file-location-structure）。
# 本流程只做 GET + 提交 catalogue.json，不读用户主目录、不跑 setup-git。
on:
  push:
    branches:
      - main
    paths:
      - 'material/urls.txt'
      - 'scripts/generate-catalogue.mjs'
      - '.gitcode/workflows/catalogue.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'

permissions:
  repository: write

jobs:
  build:
    name: 派生 catalogue
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: Checkout source code
        uses: checkout

      - name: Set up Node.js
        run: |
          node --version || true
          npm --version || true

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Derive catalogue
        # 只读 token 从仓库变量/密钥注入；缺哪个平台就跳过哪个平台的 URL，
        # 生成器把原因写进 catalogue 的 note，不产空壳条目。
        env:
          AGCLI_TOKEN: ${{ secrets.MJ_GITCODE_TOKEN }}
          MJ_GITCODE_TOKEN: ${{ secrets.MJ_GITCODE_TOKEN }}
          MJ_GITHUB_TOKEN: ${{ secrets.MJ_GITHUB_TOKEN }}
          MJ_GITEE_TOKEN: ${{ secrets.MJ_GITEE_TOKEN }}
          MJ_CNB_TOKEN: ${{ secrets.MJ_CNB_TOKEN }}
          MJ_GITLAB_TOKEN: ${{ secrets.MJ_GITLAB_TOKEN }}
          MJ_BITBUCKET_TOKEN: ${{ secrets.MJ_BITBUCKET_TOKEN }}
        run: node scripts/generate-catalogue.mjs

      - name: Commit generated catalogue
        run: |
          if git diff --quiet -- site/catalogue.json; then
            echo "catalogue unchanged"
            exit 0
          fi
          git config user.name "atomgit-actions[bot]"
          git config user.email "atomgit-actions[bot]@users.noreply.atomgit.com"
          git add site/catalogue.json
          git commit -m "chore(catalogue): auto-derived from material/urls.txt"
          git push
